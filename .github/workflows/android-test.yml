name: Build Android Test APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      version_name:
        description: "Prerelease version, for example 1.3.1-test.14"
        required: true
        type: string
      artifact_name:
        description: "Artifact base name"
        required: false
        default: "AudioBridge-Android-Test"
        type: string

permissions:
  contents: read

concurrency:
  group: android-test-${{ inputs.source_ref }}-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate test version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "Test versions must match MAJOR.MINOR.PATCH-test.N; got: $VERSION_NAME"
            exit 1
          fi

      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve shared Android version code
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          OFFSET=$((10#$YEAR - 2020))
          STAMP=$(date -u +%m%d%H%M)
          CODE=$((OFFSET * 100000000 + 10#$STAMP))
          if (( OFFSET < 0 || OFFSET > 20 || CODE <= 0 || CODE > 2100000000 )); then
            echo "Generated Android versionCode is outside the supported range: $CODE"
            exit 1
          fi
          echo "WFAS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v             -keystore "$KEYSTORE"             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')

          echo "Signing certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signer and collect asset
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$SRC"             | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          mkdir -p release-assets
          OUT="$ARTIFACT_NAME-$VERSION_NAME.apk"
          cp "$SRC" "release-assets/$OUT"
          (
            cd release-assets
            sha256sum "$OUT" > "$OUT.sha256"
          )

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ inputs.version_name }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error
