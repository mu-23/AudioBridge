name: Export Stable 153 encrypted signing backup

on:
  push:
    branches: [ "audio-bridge-lab" ]
    paths:
      - ".github/workflows/export-stable153-signing-backup.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Stable 153 signing key
        uses: actions/cache/restore@v4
        with:
          path: .ci/lab-debug.keystore
          key: wfas-audio-bridge-lab-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Verify exact Stable 153 signer
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/.ci/lab-debug.keystore"
          EXPECTED="4CC4F504BA953B31FFABB2555E3099DA31D94259CF58259B9E6B6FAE19782792"
          ACTUAL=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA256:/ {gsub(":","",$2); print toupper($2); exit}')
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified Stable 153 signer: $ACTUAL"

      - name: Encrypt keystore for offline recovery
        run: |
          set -euo pipefail
          mkdir -p backup
          cat > backup/recovery-cert.pem <<'CERT'
