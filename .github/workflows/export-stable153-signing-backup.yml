CERT
          openssl cms -encrypt -binary -aes-256-cbc \
            -in .ci/lab-debug.keystore \
            -outform DER \
            -out backup/AudioBridge-Stable153-keystore.cms \
            backup/recovery-cert.pem

          KEYSTORE_SHA=$(sha256sum .ci/lab-debug.keystore | awk '{print $1}')
          ENCRYPTED_SHA=$(sha256sum backup/AudioBridge-Stable153-keystore.cms | awk '{print $1}')
          CERT_SHA=$(sha256sum backup/recovery-cert.pem | awk '{print $1}')

          cat > backup/manifest.txt <<EOF
Stable signer certificate SHA-256:
4cc4f504ba953b31ffabb2555e3099da31d94259cf58259b9e6b6fae19782792

Original Stable 153 keystore SHA-256:
$KEYSTORE_SHA

Encrypted CMS backup SHA-256:
$ENCRYPTED_SHA

Recovery certificate file SHA-256:
$CERT_SHA

Keystore alias: androiddebugkey
Keystore store password: android
Keystore key password: android
EOF

          base64 -w 0 backup/AudioBridge-Stable153-keystore.cms > backup/AudioBridge-Stable153-keystore.cms.b64

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-Stable153-encrypted-signing-backup
          path: |
            backup/AudioBridge-Stable153-keystore.cms
            backup/AudioBridge-Stable153-keystore.cms.b64
            backup/recovery-cert.pem
            backup/manifest.txt
          if-no-files-found: error
