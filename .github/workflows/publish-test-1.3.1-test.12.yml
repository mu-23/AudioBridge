name: Build Android test.12 with permanent signer

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/publish-test-1.3.1-test.12.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          mkdir -p "$GITHUB_WORKSPACE/.ci"
          KEYSTORE="$GITHUB_WORKSPACE/.ci/audiobridge-release.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$(keytool -list -v             -keystore "$KEYSTORE"             -storepass "$SIGNING_STORE_PASSWORD"             -alias "$SIGNING_KEY_ALIAS"             | awk -F': ' '/SHA256:/ { gsub(":","",$2); print toupper($2); exit }')
          echo "Signing certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          echo "AUDIOBRIDGE_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUDIOBRIDGE_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_CODE=2300012" >> "$GITHUB_ENV"
          echo "WFAS_VERSION_NAME=1.3.1-test.12" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          OUT="AudioBridge-Android-Test-1.3.1-test.12.apk"
          test -f "$SRC"

          EXPECTED="4DDF267D25A73F0A28446C9E77293204E32F6777C63417FEB7BD925040FEFB63"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$SRC"             | awk -F': ' '/certificate SHA-256 digest:/ { gsub(":","",$2); print toupper($2); exit }')
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          cp "$SRC" "$OUT"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-Android-Test-1.3.1-test.12
          path: AudioBridge-Android-Test-1.3.1-test.12.apk
          retention-days: 7
          if-no-files-found: error
