name: Publish Android test 1.3.1 test 2

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-test-1.3.1-test.2.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Stable-153-signed test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 36306870954 \
            --repo "${{ github.repository }}" \
            --name "AudioBridge-Android-Test-1.3.1" \
            --dir release-assets
          test -f release-assets/AudioBridge-Android-Test-1.3.1-test.2.apk

      - name: Create test tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/git/ref/tags/v1.3.1-test.2" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/v1.3.1-test.2" \
              -f sha="a98807d6f8fb60ba9eaffd5162fb2f0e3df08953"
          fi

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.3.1-test.2 \
            release-assets/AudioBridge-Android-Test-1.3.1-test.2.apk \
            --repo "${{ github.repository }}" \
            --title "AudioBridge v1.3.1-test.2" \
            --notes "Test build signed with the exact Stable #153 signing identity. Keeps direct Lower/Louder notification actions and restores tap-on-notification volume slider popup for both sender and receiver. Stable #153 remains the latest stable release." \
            --prerelease
