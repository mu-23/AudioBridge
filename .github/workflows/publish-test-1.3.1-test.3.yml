name: Publish Android test 1.3.1 test 3

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-test-1.3.1-test.3.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Stable-153-signed test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 36321195883 \
            --repo "${{ github.repository }}" \
            --name "AudioBridge-Android-Test-1.3.1" \
            --dir release-assets
          test -f release-assets/AudioBridge-Android-Test-1.3.1-test.3.apk

      - name: Create test tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/git/ref/tags/v1.3.1-test.3" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/v1.3.1-test.3" \
              -f sha="9cb36b7471a578926d57bb7a6febd2a18e2691c9"
          fi

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.3.1-test.3 \
            release-assets/AudioBridge-Android-Test-1.3.1-test.3.apk \
            --repo "${{ github.repository }}" \
            --title "AudioBridge v1.3.1-test.3" \
            --notes "Test build signed with the exact Stable #153 signing identity. Fixes task-removal recovery by debouncing shutdown, blocking sticky-service resurrection after Recents removal, and recovering stale Shizuku bindings. Replaces the focus-stealing volume Activity with a non-focusable overlay slider so video apps can continue playing. Direct Lower/Louder notification actions are retained. Stable #153 remains the latest stable release." \
            --prerelease
