name: Publish Android test 1.3.1

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-test-1.3.1.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact 153-signed test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download 36305989723 \
            --repo "${{ github.repository }}" \
            --name "AudioBridge-Android-Test-1.3.1" \
            --dir release-assets
          test -f release-assets/AudioBridge-Android-Test-1.3.1.apk

      - name: Create test tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/git/ref/tags/v1.3.1-test.1" >/dev/null 2>&1; then
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/v1.3.1-test.1" \
              -f sha="4abe6a33ace752863c32a19c8834a956d1269e38"
          fi

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.3.1-test.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.3.1-test.1 \
              release-assets/AudioBridge-Android-Test-1.3.1.apk \
              --repo "${{ github.repository }}" --clobber
            gh release edit v1.3.1-test.1 \
              --repo "${{ github.repository }}" \
              --title "AudioBridge v1.3.1-test.1" \
              --prerelease
          else
            gh release create v1.3.1-test.1 \
              release-assets/AudioBridge-Android-Test-1.3.1.apk \
              --repo "${{ github.repository }}" \
              --title "AudioBridge v1.3.1-test.1" \
              --notes "Test build signed with the exact Stable #153 signing identity. Restores the Stable #153 Shizuku network-audio path, removes the notification volume popup, and restores direct Lower/Louder controls for sender and receiver. Stable #153 remains the latest stable release." \
              --prerelease
          fi
