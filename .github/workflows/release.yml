name: Release Android + Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, for example v1.2.1"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  android:
    name: Build Android with Stable 153 Signer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME#V}"
          echo "WFAS_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "WFAS_RELEASE_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "WFAS_ANDROID_ARTIFACT=AudioBridge-Android-$NAME" >> "$GITHUB_ENV"

      - name: Dispatch Stable 153 signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh workflow run stable-153-signer.yml \
            --repo "${{ github.repository }}" \
            --ref audio-bridge-lab \
            -f source_ref="$WFAS_RELEASE_TAG" \
            -f version_name="$WFAS_RELEASE_VERSION" \
            -f artifact_name="$WFAS_ANDROID_ARTIFACT"

          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow stable-153-signer.yml \
              --branch audio-bridge-lab \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$BEFORE\")][0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          test -n "$RUN_ID"
          echo "WFAS_SIGNER_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Wait for Stable 153 signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$WFAS_SIGNER_RUN_ID" \
            --repo "${{ github.repository }}" \
            --exit-status

      - name: Download Stable 153 signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$WFAS_SIGNER_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$WFAS_ANDROID_ARTIFACT" \
            --dir release-assets
          test -f "release-assets/$WFAS_ANDROID_ARTIFACT.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest
    env:
      WFAS_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build Windows portable package
        working-directory: desktop
        run: .\gradlew.bat createReleaseDistributable packagePortableArchives

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release-assets" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\desktop\build\packages\*.zip" "$env:GITHUB_WORKSPACE\release-assets\" -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*.zip
          if-no-files-found: error

  release:
    name: Publish unified release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "AudioBridge $RELEASE_TAG" \
            --generate-notes \
            release-assets/*
