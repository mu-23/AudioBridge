name: Start AudioBridge v1.3.0 Release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/start-v1.3.0-release.yml"

permissions:
  contents: write
  actions: write

jobs:
  start-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.3.0 tag if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/v1.3.0" >/dev/null 2>&1; then
            echo "Tag v1.3.0 already exists"
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/v1.3.0" \
              -f sha="$TARGET_SHA"
          fi

      - name: Start unified v1.3.0 release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f release_tag=v1.3.0
